name: Build Daily APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate android scaffold
        run: |
          cd /tmp
          flutter create --org com.abimanyu --project-name daily --platforms android scaffold
          cp -r /tmp/scaffold/android "$GITHUB_WORKSPACE/"
          cp /tmp/scaffold/.metadata "$GITHUB_WORKSPACE/" || true

      - name: Write AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application
                  android:label="Daily"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data android:name="author" android:value="Abi Manyu"/>
                  <meta-data android:name="copyright" android:value="© Abi Manyu (BlueBarry)"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          XML

      - name: Flutter pub get
        run: flutter pub get

      - name: Build universal APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Prepare output
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/daily-universal.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-universal-apk
          path: out/daily-universal.apk
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/daily-universal.apk
          body: |
            **Daily — habit tracker**
            by Abi Manyu (BlueBarry)

            ABI: armeabi-v7a + arm64-v8a + x86_64 (universal)

            Habit tracker offline-first, 4 tab (Today · Stats · Habits · Settings), i18n (en/id), heatmap api → plasma.

            © 2026 Abi Manyu. All rights reserved.
